# ==============================================================================
# Multi-Tenant Kirana Store SaaS — Nginx Production Reverse Proxy Configuration
# Supports Root Platform, Wildcard Store Subdomains (*.platform.com), and API
# ==============================================================================

# Upstream Backend API Cluster
upstream kirana_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

# 1. HTTP -> HTTPS Global Redirect
server {
    listen 80;
    listen [::]:80;
    server_name platform.com *.platform.com api.platform.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Backend Dedicated API Server (api.platform.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.platform.com;

    ssl_certificate /etc/letsencrypt/live/platform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25M;

    # Real-Time Server-Sent Events (SSE) & WebSocket Support
    location /api/events {
        proxy_pass http://kirana_backend/api/events;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for live location & order streams
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST APIs
    location / {
        proxy_pass http://kirana_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 3. Main Multi-Tenant Frontend (platform.com and *.platform.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name platform.com *.platform.com;

    ssl_certificate /etc/letsencrypt/live/platform.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/grocery-platform/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # Static Assets Caching
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy /api requests to local backend
    location /api/ {
        proxy_pass http://kirana_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Client-Side Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
