name: Kirana SaaS Platform CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # JOB 1: Code Quality, TypeScript Typecheck & Security Audit
  # --------------------------------------------------------------------------
  typecheck-and-lint:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Security Vulnerabilities Audit
        run: npm audit --audit-level=high || true

  # --------------------------------------------------------------------------
  # JOB 2: MySQL 8.0 Backend Acceptance Tests
  # --------------------------------------------------------------------------
  test-suite:
    name: Backend Acceptance Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: typecheck-and-lint

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_test_password
          MYSQL_DATABASE: kirana_saas_test_db
          MYSQL_USER: kirana_test_user
          MYSQL_PASSWORD: kirana_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Configure Test Environment
        run: |
          cat > backend/.env <<'ENV'
          PORT=5000
          NODE_ENV=test
          DB_CLIENT=mysql
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=kirana_saas_test_db
          DB_USER=kirana_test_user
          DB_PASSWORD=kirana_test_password
          JWT_SECRET=ci_test_jwt_secret
          RAZORPAY_KEY_ID=rzp_test_ci
          RAZORPAY_KEY_SECRET=rzp_test_ci_secret
          RAZORPAY_WEBHOOK_SECRET=ci_webhook_secret
          STORE_UPI_ID=apnakirana@okhdfcbank
          STORE_UPI_NAME=Apna Kirana & Supermarket
          ENV

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if mysqladmin ping \
              -h 127.0.0.1 \
              -P 3306 \
              -u kirana_test_user \
              -pkirana_test_password \
              --silent; then
              echo "MySQL is ready."
              exit 0
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

          echo "MySQL did not become ready."
          exit 1

      - name: Initialize MySQL Database
        run: npm run db:init

      - name: Start Backend
        run: |
          npm run start:backend > /tmp/kirana-backend.log 2>&1 &
          echo $! > /tmp/kirana-backend.pid

      - name: Wait for Backend
        run: |
          for i in {1..30}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/ || true)

            if [ "$HTTP_STATUS" != "000" ]; then
              echo "Backend is responding with HTTP $HTTP_STATUS."
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend failed to start."
          echo "===== BACKEND LOG ====="
          cat /tmp/kirana-backend.log
          exit 1

      - name: Run Login & Multi-Tenant Acceptance Tests
        run: node --env-file=backend/.env backend/test_all_logins.js

      - name: Run Complete SaaS Lifecycle Acceptance Tests
        run: node --env-file=backend/.env backend/test_complete_saas_lifecycle.js

      - name: Show Backend Logs on Failure
        if: failure()
        run: |
          echo "===== BACKEND LOG ====="
          cat /tmp/kirana-backend.log || true

  # --------------------------------------------------------------------------
  # JOB 3: Production Frontend Bundle Compilation & Artifact Packaging
  # --------------------------------------------------------------------------
  build-production-bundle:
    name: Build Frontend Production Bundle
    runs-on: ubuntu-latest
    needs: test-suite

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Compile Frontend Bundle
        run: npm run build

      - name: Validate Production Build Output
        run: |
          test -d dist || {
            echo "dist directory does not exist"
            exit 1
          }

          test -f dist/index.html || {
            echo "dist/index.html does not exist"
            exit 1
          }

          echo "Production bundle built successfully."
          ls -la dist/

      - name: Upload Production Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kirana-production-dist-${{ github.sha }}
          path: dist/
          retention-days: 7
