name: Kirana SaaS - Deploy to VPS

on:
  workflow_run:
    workflows: ["Kirana SaaS Platform CI Pipeline"]
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: kirana-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    steps:

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script_stop: true

          script: |
            set -e

            APP_DIR="/var/www/manakiranakottu"

            echo "======================================"
            echo "KIRANA SAAS DEPLOYMENT"
            echo "======================================"

            cd "$APP_DIR"

            echo "Current directory:"
            pwd

            echo "--------------------------------------"
            echo "1. Updating source code"
            echo "--------------------------------------"

            git fetch origin main
            git reset --hard origin/main

            echo "Current commit:"
            git log -1 --oneline

            echo "--------------------------------------"
            echo "2. Installing frontend dependencies"
            echo "--------------------------------------"

            cd "$APP_DIR/frontend"

            npm ci

            echo "--------------------------------------"
            echo "3. Building frontend"
            echo "--------------------------------------"

            npm run build

            if [ ! -d "$APP_DIR/frontend/dist" ]; then
              echo "ERROR: Frontend build failed"
              exit 1
            fi

            echo "Frontend build successful."

            echo "--------------------------------------"
            echo "4. Installing backend dependencies"
            echo "--------------------------------------"

            cd "$APP_DIR/backend"

            npm ci --omit=dev

            echo "--------------------------------------"
            echo "5. Checking backend"
            echo "--------------------------------------"

            if [ ! -f "$APP_DIR/backend/.env" ]; then
              echo "ERROR: backend/.env is missing"
              exit 1
            fi

            node --check index.js

            echo "Backend syntax check passed."

            echo "--------------------------------------"
            echo "6. Restarting backend"
            echo "--------------------------------------"

            pm2 restart manakiranakottu-backend --update-env

            echo "--------------------------------------"
            echo "7. Saving PM2 configuration"
            echo "--------------------------------------"

            pm2 save

            echo "--------------------------------------"
            echo "8. Testing Nginx configuration"
            echo "--------------------------------------"

            sudo nginx -t

            echo "--------------------------------------"
            echo "9. Reloading Nginx"
            echo "--------------------------------------"

            sudo systemctl reload nginx

            echo "--------------------------------------"
            echo "10. Backend health check"
            echo "--------------------------------------"

            PASSED=false

            for i in $(seq 1 15); do

              if curl -fsS http://127.0.0.1:5015/api/health; then
                echo ""
                echo "Backend health check PASSED."
                PASSED=true
                break
              fi

              echo "Waiting for backend... attempt $i/15"
              sleep 2

            done

            if [ "$PASSED" != "true" ]; then

              echo "ERROR: Backend health check failed."

              echo "PM2 status:"
              pm2 status

              echo "PM2 logs:"
              pm2 logs manakiranakottu-backend --lines 50 --nostream

              exit 1

            fi

            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "======================================"
